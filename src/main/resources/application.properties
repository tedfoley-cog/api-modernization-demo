# =============================================================================
# Auto Finance Platform — Monolithic Configuration
# Everything in one file: database, JPA, server, security, logging
# =============================================================================

# Server
server.port=8080

# H2 Database — shared by ALL domains (loans, payments, accounts, dealers)
spring.datasource.url=jdbc:h2:mem:autofinancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Load seed data after schema creation
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Security — HTTP Basic over /api/**, H2 console restricted to ROLE_ADMIN.
# Passwords are stored as BCrypt hashes only; override per environment, e.g.
#   APP_SECURITY_ADMIN_PASSWORDHASH=$2b$10$...
# The hashes below are throwaway local-development values (devpassword / adminpassword).
app.security.using-development-defaults=true
app.security.user.username=apiuser
app.security.user.password-hash=$2b$10$2Atj5U.ZOOb0RPx0Shyv9.WnUqFLlluiT.chot1wh8fHnjo4KBaE2
app.security.admin.username=apiadmin
app.security.admin.password-hash=$2b$10$jaDElscGwPUeE3lh/Et8l.i.wkWRLyqaOIo10MPja.LNCwPS5AEzi

# Logging
logging.level.root=INFO
logging.level.com.acme.autofinance=DEBUG
logging.level.org.springframework.web=INFO
