# =============================================================================
# Auto Finance Platform — Monolithic Configuration
# Everything in one file: database, JPA, server, security, logging
# =============================================================================

# Server
server.port=8080

# H2 Database — shared by ALL domains (loans, payments, accounts, dealers)
spring.datasource.url=jdbc:h2:mem:autofinancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Load seed data after schema creation
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.acme.autofinance=DEBUG
logging.level.org.springframework.web=INFO

# Payment service event configuration
# Stepping stone: the Payment context is event-driven internally (Spring
# Application Events) while still deployed in the monolith. This flag is the
# forward-looking toggle for moving event dispatch off-process (Kafka/RabbitMQ).
app.payments.async-processing=true
