# =============================================================================
# Payment Processing Microservice — Standalone Configuration
# Own database, own port, own lifecycle
# =============================================================================

# Server — different port from monolith
server.port=8081

# H2 Database — payment service owns its own data store
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Load seed data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging — show domain events
logging.level.root=INFO
logging.level.com.acme.payment=DEBUG
logging.level.com.acme.payment.event=INFO
